<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Social-preview layout placeholder</title>
  <desc id="description">Draft layout for a prompt-injection fine-tuning study on an RTX 4080 with 16 GB memory. Three runs produced nine checkpoints, none meeting preset capability requirements. Not a published social preview.</desc>
