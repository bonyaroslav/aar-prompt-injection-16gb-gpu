  <g font-family="Arial, Helvetica, sans-serif">
    <text x="108" y="114" font-size="18" font-weight="700" fill="#475569">SOCIAL PREVIEW · PLACEHOLDER</text>
    <text x="88" y="222" font-size="52" font-weight="700" fill="#0f172a">Prompt-injection fine-tuning</text>
